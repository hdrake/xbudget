---
constants:
  # Physical constants shared across the budgets below, declared once and
  # referred to by name (e.g. `density: "seawater_density"`). These are the
  # Boussinesq reference values MITgcm/ECCO uses.
  seawater_density:
    value: 1029.0
    units: "kg m-3"
  seawater_heat_capacity:
    value: 3994.0
    units: "J kg-1 K-1"
  # Unit-bookkeeping factors, not physical constants: each is numerically the
  # identity (value x units == 1) and exists only to cancel a scale carried in
  # an input's own `units` string. Writing them as bare numbers would leave that
  # scale in the composed units, so a salt term would stamp itself
  # `0.001 kg s-1` while holding values that are already kg/s.
  salinity_scale:            # ECCO salt fluxes are `1e-3 m3 s-1` (psu x volume)
    value: 0.001
    units: "1e3"
  grams_to_kilograms:        # SFLUX/oceSPtnd are `g m-2 s-1`
    value: 0.001
    units: "kg g-1"

mass: # finite-volume mass budget in units of kg/s
  units: "kg s-1"
  lambda: "density"
  thickness: "thkcello"
  # GM eddy-bolus mass transports (kg/s), exposed for downstream water-mass
  # transformation (xwmb). NOT part of the volume budget: the bolus velocity is
  # non-divergent, so it carries zero net volume; including it only injects
  # discretization noise and breaks native closure. In density coordinates,
  # however, the bolus transport across isopycnals is a real transformation term,
  # which is why xwmb needs these transports.
  bolus:
    x_mass_transport: "bolus_x_mass_transport"
    y_mass_transport: "bolus_y_mass_transport"
    z_mass_transport: "bolus_z_mass_transport"
  lhs:
    sum:
      Eulerian_tendency:
        product:
          volume_tendency:
            product:
              free_surface_tendency:
                product:
                  deta:
                    difference: {etan: "ETAN_bounds"}
                  dt_inv:
                    reciprocal: {dt: {var: "dt"}}
              volume: "volcello"
              deptho_inv:
                reciprocal: {deptho: {var: "Depth"}}
          density: "seawater_density"
  rhs:
    sum:
      advection:
        sum:
          # Eulerian-only (see the `bolus` metadata above): the GM bolus velocity
          # is non-divergent, so it is excluded from the native volume budget.
          lateral: # Eulerian lateral mass-flux convergence, div(-Fx,-Fy) = -div(Fx,Fy)
            product:
              sign: -1.0
              density: "seawater_density"
              volume_flux_divergence:
                lateral_divergence:
                  Fx:
                    product: {x_velocity: "UVELMASS", dyG: "dyG", dz: "drF"}
                  Fy:
                    product: {y_velocity: "VVELMASS", dxG: "dxG", dz: "drF"}
          interfacial: # Eulerian vertical mass-flux convergence
            product:
              volume_flux_convergence:
                difference: {z_velocity: "WVELMASS_interior"} # WVELMASS zeroed at surface to avoid double-counting oceFWflx
              density: "seawater_density"
              area: "rA"
      surface_exchange_flux:
        product:
          mass_tendency_per_unit_area: "boundary_forcing_volume_tendency"
          sign: 1.0
          area: "rA"

heat: # finite-volume heat budget in s* in units of J/s (W)
  units: "W"
  lambda: "THETA"
  lhs:
    sum:
      Eulerian_tendency:
        product:
          density: "seawater_density"
          specific_heat_capacity: "seawater_heat_capacity"
          volume: "volcello"
          heatcontenttend:
            product:
              dt_inv:
                reciprocal:
                  dt:
                    var: "dt"
              heatcontentdiff:
                difference:
                  heatcontent:
                    product: 
                      theta: "THETA_bounds"
                      stretching_factor:
                        sum:
                          one: 1.0
                          eta_over_depth:
                            product:
                              eta: "ETAN_bounds"
                              deptho_inv:
                                reciprocal: 
                                  deptho:
                                    var: "Depth"
  rhs:
    sum:
      advection:
        sum:
          lateral:
            product:
              density: "seawater_density"
              specific_heat_capacity: "seawater_heat_capacity"
              heat_flux_convergence:
                product:
                  heat_flux_divergence:
                    lateral_divergence:
                      Fx:
                        product: {advx_th: "ADVx_TH"}
                      Fy:
                        product: {advy_th: "ADVy_TH"}
                  sign: -1.0
          interfacial:
            product:
              density: "seawater_density"
              specific_heat_capacity: "seawater_heat_capacity"
              heat_flux_convergence:
                difference: {advr_th: "ADVr_TH"}
      diffusion:
        sum:
          lateral:
            product:
              density: "seawater_density"
              specific_heat_capacity: "seawater_heat_capacity"
              explicit_heat_flux_convergence:
                product:
                  heat_flux_divergence:
                    lateral_divergence:
                      Fx:
                        product:
                          dfx_th: "DFxE_TH"
                      Fy:
                        product:
                          dfy_th: "DFyE_TH"
                  sign: -1.0
          explicit_vertical_diffusion:
            product:
              density: "seawater_density"
              specific_heat_capacity: "seawater_heat_capacity"
              heat_flux_convergence:
                difference: {dfrE_th: "DFrE_TH"}
          implicit_vertical_diffusion:
            product:
              density: "seawater_density"
              specific_heat_capacity: "seawater_heat_capacity"
              heat_flux_convergence:
                difference: {dfrI_th: "DFrI_TH"}
                  
      surface_exchange_flux:  # sum: #TFLUX, QFLUX, etc. includes freshwater forcing 
        product:
          density: "seawater_density"
          specific_heat_capacity: "seawater_heat_capacity"
          boundary_heat_flux: "boundary_forcing_heat_tendency"  # deg C /s 
      bottom_flux:
        product:
          density: "seawater_density"
          specific_heat_capacity: "seawater_heat_capacity"
          surface_heat_flux: "geothermal_heat_flux_convergence"  # deg C m^3 /s 


salt: # finite-volume salt-content budget in units of kg/s  (salt mass, not salinity)
  units: "kg s-1"
  # Salt content per cell:  ρ * V * (s* SALT) * 1e-3   since SALT is in psu ~ g/kg
  lambda: "SALT"
  lhs:
    sum:
      Eulerian_tendency:
        product:
          density: "seawater_density"
          volume: "volcello"
          unit_conversion: "salinity_scale"
          saltcontenttend:
            product:
              dt_inv:
                reciprocal: {dt: {var: "dt"}}
              saltcontentdiff:
                difference:
                  saltcontent:
                    product:
                      SALT: "SALT_bounds"
                      stretching_factor:
                        sum:
                          one: 1.0
                          eta_over_depth:
                            product:
                              eta: "ETAN_bounds"
                              deptho_inv:
                                reciprocal: {deptho: {var: "Depth"}}
  rhs:
    sum:
      advection: 
        sum:

          lateral:
            product:
              density: "seawater_density"
              unit_conversion: "salinity_scale"
              sign: -1.0
              salt_flux_divergence:
                lateral_divergence:
                  Fx: {product: {advx_slt: "ADVx_SLT"}}
                  Fy: {product: {advy_slt: "ADVy_SLT"}}

          interfacial:
            product:
              density: "seawater_density"
              unit_conversion: "salinity_scale"
              salt_flux_convergence:
                difference: {advr_slt: "ADVr_SLT"}

      diffusion: 
        sum:
          lateral:
            product:
              density: "seawater_density"
              unit_conversion: "salinity_scale"
              sign: -1.0
              salt_flux_divergence:
                lateral_divergence:
                  Fx: {product: {dfxe_slt: "DFxE_SLT"}}
                  Fy: {product: {dfye_slt: "DFyE_SLT"}}

          explicit_vertical_diffusion:
            product:
              density: "seawater_density"
              unit_conversion: "salinity_scale"
              salt_flux_convergence:
                difference: {dfrE_slt: "DFrE_SLT"}
          implicit_vertical_diffusion:
            product:
              density: "seawater_density"
              unit_conversion: "salinity_scale"
              salt_flux_convergence:
                difference: {dfrI_slt: "DFrI_SLT"}

      surface_exchange_flux: # (SFLUX + oceSPtnd at k=0; oceSPtnd below) in g/m^2/s, mapped to kg/s
        product:
          unit_conversion_g_to_kg: "grams_to_kilograms"
          area: "rA"
          salt_forcing_per_unit_area: "boundary_forcing_salt_tendency"